[package]
name = "bender-recorder"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Grabador de datos públicos de Binance (spot + USDⓈ-M): zonas cruda y normalizada en bender-store, latidos, huecos y recuperación (ADR-0004, ADR-0011)."

[lints]
workspace = true

[dependencies]
bender-store = { path = "../bender-store" }
bender-types = { path = "../bender-types" }
# Sin la feature `private`: el grabador no tiene acceso a claves (Pilar 3).
bender-venue-binance = { path = "../bender-venue-binance" }
blake3 = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
toml = "0.9"

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
bender-kernel = { path = "../bender-kernel" }
bender-runner = { path = "../bender-runner" }
