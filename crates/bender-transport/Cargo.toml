[package]
name = "bender-transport"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Transporte entre componentes (ADR-0005): Connect/gRPC en proceso y en red, streams reanudables por cursor y versionado de protocolo."

[lints]
workspace = true

[dependencies]
bender-types = { path = "../bender-types" }
bytes = "1"
http = "1"
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "io-std", "signal"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
tonic-web = "0.14"
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
rcgen = "0.14"
