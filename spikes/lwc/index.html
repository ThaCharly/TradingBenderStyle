<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spike gráfica LWC</title>
    <style>
      /* Herramienta de medición con un solo aspecto oscuro (como la gráfica real). */
      :root {
        color-scheme: dark;
        --bg: #0e1118;
        --panel: #171b26;
        --line: #2a2e39;
        --text: #d1d4dc;
        --muted: #8a90a0;
        --accent: #2962ff;
        --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body { background: var(--bg); color: var(--text); }
      body { margin: 0; font: 14px/1.45 var(--font); }
      .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
      header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-block: 10px; background: var(--panel); }
      header h1 { font-size: 15px; margin: 0 8px 0 0; text-wrap: balance; }
      button { background: var(--line); color: var(--text); border: 1px solid #363a45; border-radius: 6px; padding: 8px 12px; font: inherit; cursor: pointer; }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button:disabled { opacity: 0.5; cursor: progress; }
      #status { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
      #charts { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 4px; height: 70vh; padding-block: 4px; }
      @media (max-width: 700px) { #charts { grid-template-columns: 1fr; grid-template-rows: 2fr 1fr 1fr 1fr; height: 120vh; } }
      .cell { position: relative; min-height: 0; min-width: 0; }
      .tag { position: absolute; z-index: 5; left: 6px; top: 4px; font-size: 11px; color: var(--muted); pointer-events: none; }
      #out { padding-block: 8px 32px; display: grid; gap: 8px; }
      #results { white-space: pre-wrap; background: var(--panel); padding: 12px; border-radius: 6px; font: 12px/1.55 var(--mono); overflow-wrap: anywhere; min-width: 0; font-variant-numeric: tabular-nums; }
      .help { color: var(--muted); font-size: 13px; margin: 0; max-width: 70ch; }
    </style>
  </head>
  <body>
    <header class="gutter">
      <h1>Spike #44 · Lightweight Charts v5</h1>
      <button id="run" class="primary">Medir</button>
      <button id="log">Escala: lineal</button>
      <button id="heat">Heatmap: no</button>
      <span id="status">Cargando…</span>
    </header>
    <div id="charts" class="gutter"></div>
    <section id="out" class="gutter">
      <p class="help">Arrastrá una línea de orden (verdes y rojas), la línea azul, el rectángulo naranja o el violeta (anclado en el futuro). Después tocá <b>Medir</b> (≈20 s, sin tocar la pantalla) y copiá el resultado.</p>
      <div id="results">Todavía sin medir.</div>
      <div><button id="copy" hidden>Copiar resultado</button></div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
