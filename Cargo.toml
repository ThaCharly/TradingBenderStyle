[workspace]
resolver = "3"
members = ["crates/*", "tools/devtools", "tools/arch-tests"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Pilar 2: sólo tiene efecto en los crates con clippy.toml (ver tools/arch-tests). `forbid`
# impide desactivarlo con #[allow].
disallowed_methods = "forbid"
