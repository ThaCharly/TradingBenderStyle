syntax = "proto3";

// Paquete del modelo de datos universal (Pilar 1). Los mensajes reales llegan con #17 y #18.
package bender.v1;

// Identifica la versión del esquema que produce o consume un componente.
message SchemaInfo {
  // Versión semántica del esquema, p. ej. "1.0.0".
  string version = 1;
}
